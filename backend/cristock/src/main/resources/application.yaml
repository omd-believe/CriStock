spring:
  application:
    name: cristock

  datasource:
    url: jdbc:postgresql://localhost:5432/cristock_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.hibernate.format_sql: true

server:
  port: 8080